[project]
name = "revenue-leakage-agent"
version = "1.0.0"
description = "Revenue Leakage AI Agent built with LangGraph, FastAPI, and uv"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain>=1.0",
    "python-dotenv>=1.0.1",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "openinference-instrumentation-langchain>=0.1.20",
    "structlog>=26.1.0",
    "langfuse>=4.15.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E401", "E701", "E702"]
